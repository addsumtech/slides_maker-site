<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual-language library | slide-maker</title>
<meta name="description" content="Every visual language in slide-maker: complete, checked looks for a deck, each with two grounds and seven page compositions. See them, compare them, and copy the line that asks for one.">
<link rel="canonical" href="https://slides.addsum.top/languages/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="slide-maker by Addsum">
<meta property="og:title" content="slide-maker — the visual-language library">
<meta property="og:description" content="Complete, checked looks for a deck: two grounds, seven page compositions, every chart wearing it.">
<meta property="og:url" content="https://slides.addsum.top/languages/">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="library.css">
</head>
<body>
<header class="hero">
  <div class="bgGrid" aria-hidden="true"></div>
  <div class="wrap">
    <div class="brand">
      <a class="home" href="/"><img src="/logo-160.png" alt="" width="34" height="34"><span class="name">slide-maker</span></a>
      <span class="crumb" data-i18n="crumb">Visual languages</span>
      <button class="langpill" id="langBtn" type="button" aria-label="Switch language">中文</button>
      <a class="btn ghost" id="galleryBtn" href="/" data-i18n="gallery">Deck gallery</a>
      <a class="btn ghost gh" href="https://github.com/addsumtech/slides_maker">GitHub ★</a>
    </div>
    <h1 id="headline">The visual-language library</h1>
    <p class="lede" id="lede"></p>
    <div class="stats" id="stats" aria-live="polite"></div>
  </div>
</header>

<main class="wrap">
  <div class="bar" role="search">
    <label class="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
      <span class="sr" data-i18n="searchLabel">Search languages</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search">
    </label>
    <div class="toggle" id="kinds" role="group" aria-label="Kind"></div>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <p id="emptyText"></p>
    <button class="btn ghost" id="clearBtn" type="button" data-i18n="clear">Clear filters</button>
  </div>
  <noscript><p class="empty">This page lists the languages with JavaScript. The same samples are in the
    <a href="https://github.com/addsumtech/slides_maker#visual-languages">README</a>.</p></noscript>
</main>

<footer class="foot wrap" id="foot"></footer>

<dialog id="detail" aria-labelledby="dTitle">
  <div class="dhead">
    <div>
      <h2 id="dTitle"></h2>
      <p class="dmeta" id="dMeta"></p>
    </div>
    <button class="close" id="closeBtn" type="button" aria-label="Close">×</button>
  </div>
  <div class="dbody" id="dBody"></div>
</dialog>

<script src="library.js"></script>
</body>
</html>
