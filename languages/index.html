<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual languages | slide-maker</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://slides.addsum.top/">
<!-- The visual-language library is now a section of the home page (#languages). This address only forwards old
     links there: the reader's language picks / or /cn/, a search (?q=, ?kind=) is kept, and an old #<language>
     becomes #vl-<language>. library.json and media/ stay in this folder; the section reads them from here. -->
<meta http-equiv="refresh" content="0; url=/#languages">
<script>
(function () {
  var lang = null;
  try { lang = localStorage.getItem('addsum-lang'); } catch (e) { /* storage blocked */ }
  if (lang !== 'zh' && lang !== 'en') lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
  var h = location.hash.replace(/^#/, '');
  var hash = /^[a-z][a-z0-9_]*$/.test(h) ? '#vl-' + h : '#languages';
  location.replace((lang === 'zh' ? '/cn/' : '/') + location.search + hash);
})();
</script>
</head>
<body>
<p><a href="/#languages">The visual-language library has moved to the home page.</a></p>
</body>
</html>
